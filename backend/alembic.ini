[alembic]
script_location = alembic
file_template = %(rev)s_%(slug)s
timezone = UTC
sqlalchemy.url = postgresql+psycopg2://orvex_user:orvex_dev_secret@localhost:5432/orvex_db

[post_write_hooks]

[loggers]
keys = root,sentinel,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sentinel]
level = WARN
handlers =
qualname = sentinel

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
